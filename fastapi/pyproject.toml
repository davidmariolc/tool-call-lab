[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]>=0.121.0",
  "jinja2>=3.1.4",
  "openai>=3.46.0",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.2.1",
  "uvicorn>=0.34.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = ["pyright>=1.1.414", "ruff>=0.17.4"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
